<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Teste seus conhecimentos com este quiz de conhecimentos gerais.">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Quiz de conhecimentos gerais</title>
</head>
<body>
    <main class="quiz-card">
        <header class="quiz-header">
            <p class="eyebrow">DESAFIO RÁPIDO</p>
            <h1>Quiz de conhecimentos gerais</h1>
            <p class="intro">Responda às 10 perguntas e descubra quantas você consegue acertar.</p>
        </header>

        <section id="quiz" aria-labelledby="question">
            <div class="progress-info">
                <span id="question-count">Pergunta 1 de 10</span>
                <span id="score">Acertos: 0</span>
            </div>
            <div
                class="progress-track"
                id="progress-track"
                role="progressbar"
                aria-label="Progresso do quiz"
                aria-valuemin="0"
                aria-valuemax="10"
                aria-valuenow="0"
            >
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <h2 id="question"></h2>
            <div id="answers" class="answers"></div>
            <p id="feedback" class="feedback" aria-live="polite"></p>
            <button id="next-button" class="next-button" type="button" disabled>
                Conferir resposta
            </button>
        </section>

        <section id="result" class="result" aria-live="polite" hidden>
            <p class="eyebrow">QUIZ CONCLUÍDO</p>
            <h2 id="result-title"></h2>
            <p id="result-message"></p>
            <button id="restart-button" class="next-button" type="button">
                Tentar novamente
            </button>
        </section>
    </main>
</body>
</html>
